[project]
name = "btmetric"
version = "0.1.0"
description = "Research on a translation quality metric for minority language Bible translation"
authors = [{ name = "SIL International" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2.6,<3.0.0",
    "pandas>=2.2,<3",
    "pyyaml>=6.0,<7",
    "sacrebleu>=2.6,<3",
    "scipy>=1.11.2,<2",
    "sentencepiece>=0.2.0,<0.3",
    "sil-machine[thot]==1.9.2",
]

[project.scripts]
btmetric-index-experiments = "btmetric.experiments.index:main"
btmetric-find-system-pairs = "btmetric.experiments.pairs:main"
btmetric-measure-pair-differences = "btmetric.experiments.similarity:main"
btmetric-pair-back-translations = "btmetric.scripture.back_translations:main"
btmetric-download-datasets = "btmetric.datasets.download:main"
btmetric-find-bible-corpora = "btmetric.scripture.corpora:main"
btmetric-meta-evaluate = "btmetric.meta_eval.runner:main"
btmetric-test-human-translations = "btmetric.analysis.human_translations:main"
btmetric-score-system-pairs = "btmetric.analysis.system_pairs:main"
btmetric-build-challenge-set = "btmetric.perturbations.challenge_set:build_main"
btmetric-evaluate-challenge-set = "btmetric.perturbations.challenge_set:evaluate_main"
btmetric-validate-rendering-inference = "btmetric.terms.validate:main"
btmetric-measure-error-rates = "btmetric.perturbations.calibration:main"
btmetric-build-natural-errors = "btmetric.perturbations.natural_errors:main"
btmetric-fit-combination = "btmetric.combination.challenge:main"
btmetric-fit-combination-human = "btmetric.combination.human:main"
btmetric-check-mqm-error-categories = "btmetric.analysis.mqm_error_categories:main"
btmetric-memorization-gate = "btmetric.analysis.memorization_gate:main"

[dependency-groups]
dev = [
    "black>=25.1",
    "flake8>=7.1",
    "isort>=6.0",
    "pytest>=8.3",
]
gpu = [
    "torch>=2.7",
    "transformers>=4.46,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btmetric"]

[tool.black]
line-length = 120
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# The GPU group (PyTorch, transformers) is installed by default, so `uv run` never removes it.
default-groups = ["dev", "gpu"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
