[project]
name = "btmetric"
version = "0.1.0"
description = "Research on a translation quality metric for minority language Bible translation"
authors = [{ name = "SIL International" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.2.6,<3.0.0",
    "pandas>=2.2,<3",
    "pyyaml>=6.0,<7",
    "sacrebleu>=2.6,<3",
    "scipy>=1.11.2,<2",
]

[project.scripts]
btmetric-index-experiments = "btmetric.experiments.index:main"
btmetric-find-system-pairs = "btmetric.experiments.pairs:main"
btmetric-pair-back-translations = "btmetric.scripture.back_translations:main"
btmetric-download-datasets = "btmetric.datasets.download:main"
btmetric-find-bible-corpora = "btmetric.scripture.corpora:main"
btmetric-meta-evaluate = "btmetric.meta_eval.runner:main"

[dependency-groups]
dev = [
    "black>=25.1",
    "flake8>=7.1",
    "isort>=6.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btmetric"]

[tool.black]
line-length = 120
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
